<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrowRecipes: Eat Better. Spend Less.</title>
<meta name="description" content="Student-friendly recipes that fit your diet and budget, with the cheapest grocery store for every ingredient.">
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='64' height='64' rx='18' fill='%232E8B57'/%3E%3Cg transform='translate(5.76 5.76) scale(.82)' fill='%23fff'%3E%3Cpath d='M11 35h42c0 11.5-9.5 19-21 19S11 46.5 11 35z'/%3E%3Cpath d='M32 29C21 30 15 24 15 15c9-1 16 4 17 14z'/%3E%3Cpath d='M32 24C32 14 38 8 49 8c1 11-6 17-17 16z'/%3E%3Cpath d='M32 36V22' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' fill='none'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:#2E8B57; --gd:#1F5F3F; --gl:#EAF5EC; --white:#FFFFFF; --bg:#F7FBF7; --ink:#252B27;
  --surface:#FFFFFF; --on-g:#FFFFFF;
  --muted:color-mix(in srgb,var(--ink) 64%,#fff);
  --line:color-mix(in srgb,var(--g) 18%,#fff);
  --line2:color-mix(in srgb,var(--g) 32%,#fff);
  --link:var(--gd); --soft:var(--gl);
  --t1:#1F5F3F; --t2:#2E8B57; --t3:#6DB58C; --t4:#BFE0CB; --t5:#EAF5EC;
  --shadow:0 1px 2px rgba(31,95,63,.06),0 10px 28px rgba(31,95,63,.08);
  --shadow-lg:0 2px 4px rgba(31,95,63,.08),0 24px 48px rgba(31,95,63,.14);
  --logo-word:#1F5F3F; --logo-word2:#2E8B57;
  --r:18px; --r-sm:12px;
  --fd:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --fb:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A14; --surface:#16251C; --gl:#1D3326; --ink:#EAF5EC; --soft:#1D3326;
    --muted:color-mix(in srgb,#EAF5EC 68%,#16251C);
    --line:color-mix(in srgb,#2E8B57 32%,#16251C); --line2:color-mix(in srgb,#2E8B57 55%,#16251C);
    --link:#8FD3AB; --logo-word:#EAF5EC; --logo-word2:#6DB58C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25); --shadow-lg:0 24px 48px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A14; --surface:#16251C; --gl:#1D3326; --ink:#EAF5EC; --soft:#1D3326;
  --muted:color-mix(in srgb,#EAF5EC 68%,#16251C);
  --line:color-mix(in srgb,#2E8B57 32%,#16251C); --line2:color-mix(in srgb,#2E8B57 55%,#16251C);
  --link:#8FD3AB; --logo-word:#EAF5EC; --logo-word2:#6DB58C; color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--fb);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{font-family:var(--fd);letter-spacing:-.02em;line-height:1.12;margin:0;font-weight:700}
p{margin:0}
a{color:var(--link);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--g);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:1.2em;height:1.2em;flex:none;vertical-align:-.2em}
.muted{color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}

/* buttons */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;border-radius:999px;padding:12px 22px;font-weight:700;font-size:16px;line-height:1.1;background:var(--g);color:var(--on-g);transition:background .15s,transform .1s,box-shadow .15s}
.btn:hover{background:var(--gd)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--link);border-color:var(--line2)}
.btn.ghost:hover{background:var(--gl)}
.btn.soft{background:var(--gl);color:var(--link)}
.btn.soft:hover{background:var(--line)}
.btn.lg{padding:16px 30px;font-size:18px}
.btn.sm{padding:8px 14px;font-size:14px}
.linkbtn{background:none;border:0;padding:0;color:var(--link);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600;transition:all .15s}
.chip:hover{border-color:var(--g)}
.chip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:var(--on-g)}
.chip .ico{display:none}
.chip[aria-pressed="true"] .ico{display:inline-block}
.chip.sm{padding:6px 12px;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--gl);color:var(--link);font-size:13px;font-weight:700}
.tag.solid{background:var(--g);color:var(--on-g)}
.tag.line{background:transparent;border:1.5px solid var(--line2)}

/* choice cards */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.opt{display:flex;flex-direction:column;gap:4px;text-align:left;padding:18px 20px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);transition:all .15s}
.opt:hover{border-color:var(--g)}
.opt[aria-pressed="true"]{border-color:var(--g);background:var(--gl);box-shadow:inset 0 0 0 1px var(--g)}
.opt b{font-family:var(--fd);font-size:20px;letter-spacing:-.01em}
.opt span{color:var(--muted);font-size:14px}

/* inputs */
.inp{width:100%;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.inp:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px color-mix(in srgb,var(--g) 18%,transparent)}
.lbl{display:block;font-weight:700;margin-bottom:6px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:24px}

/* ---------- onboarding ---------- */
.ob{min-height:100vh;display:flex;flex-direction:column}
.ob-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;max-width:900px;margin:0 auto;width:100%}
.ob-prog{flex:1;height:8px;border-radius:99px;background:var(--gl);overflow:hidden;max-width:360px;margin-left:auto}
.ob-prog i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .35s ease}
.ob-body{flex:1;width:100%;max-width:760px;margin:0 auto;padding:12px 20px 120px}
.ob-body h1{font-size:clamp(30px,5vw,44px);margin-bottom:10px}
.ob-body .sub{color:var(--muted);font-size:18px;margin-bottom:28px;max-width:56ch}
.ob-body .step-in{animation:stepin .35s ease both}
@keyframes stepin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.ob-foot{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.ob-foot div{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;gap:12px;align-items:center}
.sec-t{font-family:var(--fd);font-size:20px;margin:28px 0 12px}
.note{display:flex;gap:10px;padding:12px 16px;border-radius:14px;background:var(--gl);color:var(--ink);font-size:14.5px;align-items:flex-start}
.note .ico{margin-top:3px;color:var(--g)}

/* welcome */
.welcome{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:40px;max-width:1180px;margin:0 auto;padding:28px 24px}
.welcome h1{font-size:clamp(42px,6.2vw,84px);line-height:1;letter-spacing:-.035em;margin:34px 0 20px;color:var(--logo-word);text-wrap:balance}
.welcome .sub{font-size:20px;color:var(--muted);max-width:46ch;margin-bottom:32px}
.welcome .ctas{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.stage{position:relative;aspect-ratio:1/1.02;max-width:520px;width:100%;justify-self:center}
.stage .plate{position:absolute;top:0;left:2%;width:88%;aspect-ratio:1;border-radius:50%;background:var(--gl);overflow:hidden}
.stage .plate svg{width:100%;height:100%}
.stage .receipt{position:absolute;right:0;bottom:0;width:78%;transform:rotate(2.5deg)}
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:16px 18px 24px;box-shadow:var(--shadow-lg);position:relative;font-size:14px}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:radial-gradient(circle at 7px 100%,var(--bg) 6px,transparent 6.5px) 0 0/14px 10px repeat-x}
.receipt .rr{display:flex;align-items:baseline;gap:8px;padding:5px 0}
.receipt .rr .dots{flex:1;border-bottom:2px dotted var(--line2);transform:translateY(-4px)}
.receipt .rr b{font-variant-numeric:tabular-nums}
.receipt .rr em{font-style:normal;color:var(--muted);font-size:12.5px}
.receipt .tot{display:flex;justify-content:space-between;margin-top:8px;padding-top:10px;border-top:2px solid var(--ink);font-weight:800;font-family:var(--fd);font-size:17px}
.receipt .save{margin-top:10px;background:var(--g);color:var(--on-g);border-radius:10px;padding:8px 12px;font-weight:700;text-align:center;font-size:14px}

/* logo */
.logo{display:inline-flex;align-items:center;gap:10px;color:var(--logo-word);font-family:var(--fd);font-weight:800;letter-spacing:-.03em;font-size:26px;line-height:1}
.logo svg{width:1.5em;height:1.5em}
.logo .w2{color:var(--logo-word2);font-weight:600}
.logo.sm{font-size:21px}

/* ---------- app shell ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:18px;height:68px;max-width:1320px}
.nav{display:flex;gap:4px}
.nav a{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap}
@media (max-width:1280px){.nav a .ico{display:none}}
.nav a:hover{background:var(--gl)}
.nav a[aria-current="page"]{background:var(--gl);color:var(--link)}
.nav a[aria-current="page"] .ico{color:var(--g)}
.search{position:relative;flex:1;min-width:150px;max-width:340px;margin-left:auto}
.search input{padding-left:42px;border-radius:999px;background:var(--bg)}
.search .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--g);color:var(--on-g);display:grid;place-items:center;font-weight:800;font-family:var(--fd)}
.tabs{display:none}
main{padding:22px 0 80px}
.page-h{margin-bottom:26px}
.page-h h1{font-size:clamp(30px,4.4vw,46px)}
.page-h p{color:var(--muted);font-size:18px;margin-top:8px}
.sechead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:44px 0 16px}
.sechead h2{font-size:clamp(22px,3vw,28px)}
.sechead p{color:var(--muted);margin-top:4px}

/* recipe cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,300px);gap:20px;overflow-x:auto;padding:4px 4px 18px;margin:0 -4px;scroll-snap-type:x proximity}
.rail>*{scroll-snap-align:start}
.rc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.rc:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.rc-art{display:block;aspect-ratio:3/2;background:var(--gl)}
.rc-art svg{width:100%;height:100%;display:block}
.heart{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--link);display:grid;place-items:center;box-shadow:0 2px 8px rgba(31,95,63,.18);transition:transform .15s}
.heart:hover{transform:scale(1.08)}
.heart[aria-pressed="true"]{background:var(--g);color:var(--on-g)}
.heart[aria-pressed="true"] svg{fill:currentColor}
.rc-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.rc-b h3{font-size:20px}
.rc-b h3 a{color:var(--ink)}
.rc-b h3 a:hover{color:var(--link)}
.rc-meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px;align-items:center}
.rc-meta span{display:inline-flex;align-items:center;gap:5px}
.rc-price{display:flex;align-items:baseline;gap:8px}
.rc-price b{font-family:var(--fd);font-size:24px;color:var(--link);letter-spacing:-.02em}
.rc-price span{color:var(--muted);font-size:14px}
.rc-tags{display:flex;flex-wrap:wrap;gap:6px}
.rc-foot{margin-top:auto;display:flex;gap:8px}
.rc-foot .btn{flex:1}
.skel{border-radius:var(--r);height:380px;background:linear-gradient(100deg,var(--gl) 30%,var(--surface) 50%,var(--gl) 70%) 0 0/300% 100%;animation:sk 1.2s linear infinite;border:1px solid var(--line)}
@keyframes sk{to{background-position:-300% 0}}
.spin{display:inline-block;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* hero (home) */
.hello{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:8px}
.hello h1{font-size:clamp(32px,5vw,54px)}
.hello p{font-size:19px;color:var(--muted);margin-top:10px}
.prefline{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:22px}
.filters .inp{width:auto;min-width:150px}
.empty{text-align:center;padding:56px 20px;border:2px dashed var(--line2);border-radius:var(--r);color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:8px;font-size:22px}
.empty .btn{margin-top:16px}

/* recipe page */
.back{display:inline-flex;align-items:center;gap:8px;font-weight:700;margin-bottom:18px;color:var(--link)}
.rhero{display:grid;grid-template-columns:1.1fr 1fr;gap:34px;align-items:start}
.rhero .art{border-radius:var(--r);overflow:hidden;background:var(--gl);aspect-ratio:3/2;border:1px solid var(--line)}
.rhero .art svg{width:100%;height:100%;display:block}
.rhero h1{font-size:clamp(30px,4.4vw,48px);margin:10px 0 12px}
.rhero .desc{font-size:18px;color:var(--muted);margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:var(--gl);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--fd);font-size:20px}
.stat span{font-size:13.5px;color:var(--muted)}
.costbox{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.costbox>div{padding:14px 18px}
.costbox>div+div{border-left:1px solid var(--line)}
.costbox b{display:block;font-family:var(--fd);font-size:30px;color:var(--link);letter-spacing:-.03em;line-height:1.1}
.costbox span{font-size:13.5px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.two{display:grid;grid-template-columns:1fr 1.2fr;gap:28px;margin-top:36px;align-items:start}
.ings{list-style:none;margin:0;padding:0}
.ings li{border-bottom:1px solid var(--line)}
.ings label{display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer}
.ings .q{flex:1}
.ings .q small{display:block;color:var(--muted);font-size:13px}
.ings .pr{font-variant-numeric:tabular-nums;font-weight:700;color:var(--link)}
.ings li.done .q{text-decoration:line-through;color:var(--muted)}
.cb{appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);background:var(--surface);display:grid;place-items:center;flex:none;cursor:pointer;margin:0}
.cb:checked{background:var(--g);border-color:var(--g)}
.cb:checked::after{content:"";width:6px;height:11px;border:solid var(--on-g);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start}
.steps li::before{content:counter(s);width:40px;height:40px;border-radius:50%;background:var(--g);color:var(--on-g);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:18px}
.steps p{padding-top:6px}
.steps .tm{display:inline-flex;margin-left:8px;vertical-align:1px}
.ask{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sample-note{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}

/* comparison */
.cmp{margin-top:44px;scroll-margin-top:90px}
.cmp-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:16px}
.seg{display:inline-flex;background:var(--gl);padding:4px;border-radius:999px}
.seg button{border:0;background:transparent;padding:9px 16px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--link)}
.seg button[aria-pressed="true"]{background:var(--g);color:var(--on-g)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{padding:16px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.tile b{display:block;font-family:var(--fd);font-size:28px;letter-spacing:-.03em}
.tile span{font-size:13.5px;color:var(--muted)}
.tile.hi{background:var(--g);border-color:var(--g);color:var(--on-g)}
.tile.hi span{color:color-mix(in srgb,var(--on-g) 82%,transparent)}
.ledger{padding:6px 22px 30px;border-radius:var(--r) var(--r) 0 0;position:relative}
.ledger::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:radial-gradient(circle at 8px 100%,var(--bg) 7px,transparent 7.5px) 0 0/16px 12px repeat-x}
.lrow{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(190px,1fr) minmax(220px,1.6fr);gap:10px 20px;padding:16px 0;border-bottom:2px dotted var(--line2);align-items:center}
.lrow:last-child{border-bottom:0}
.lrow .nm b{display:block}
.lrow .nm small{color:var(--muted)}
.best{display:flex;align-items:center;gap:10px}
.best .price{font-family:var(--fd);font-weight:800;font-size:24px;color:var(--link);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.best .st{display:flex;flex-direction:column;line-height:1.2}
.best .st b{font-size:15px}
.best .st small{color:var(--muted);font-size:12.5px}
.others{display:flex;flex-wrap:wrap;gap:6px}
.o{font-size:13px;padding:3px 9px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.o.win{background:var(--gl);border-color:var(--g);color:var(--link);font-weight:700}
.savechip{margin-left:auto;font-size:13px;font-weight:700;color:var(--link);background:var(--gl);padding:3px 9px;border-radius:999px;white-space:nowrap}
.shop{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.shop .grp{padding:18px 20px}
.shop .grp h4{display:flex;justify-content:space-between;font-size:18px;margin-bottom:6px}

const ING={};
CATALOG_SRC.trim().split('\n').forEach(l=>{const [id,name,u,size,price,pr,fl,cat,lab,st]=l.split('|');ING[id]={id,name,u,size:+size,price:+price,pr:+pr,fl:fl||'',cat,lab:lab||'ct',staple:st==='1'}});

const CUISINES=['Italian','Mexican','Asian','Mediterranean','American','Indian','Middle Eastern','Fast food alternatives','Healthy meals'];
const ART_TYPES=['bowl','pasta','soup','wrap','pizza','egg','salad','bake'];


/* ================= CORE ================= */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Math.round(n*100)/100).toFixed(2);
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0;
const hash=s=>{let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)/4294967296};
function rng(seed){let a=Math.floor(hash(seed)*4294967296)||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* Dietary rules work on ingredient flag letters, so every recipe (including
   AI-created ones) is checked by code, never by trusting a label. */
const DIET_OK={
  'Vegetarian':f=>!/[mkfs]/.test(f),
  'Vegan':f=>!/[mkfsdeh]/.test(f),
  'Pescatarian':f=>!/[mk]/.test(f),
  'Halal':f=>!/[kq]/.test(f),
  'Gluten-free':f=>!f.includes('g'),
  'Dairy-free':f=>!f.includes('d'),
  'Nut-free':f=>!/[np]/.test(f)
};
const ALLERGY={'Peanuts':'p','Tree nuts':'n','Shellfish':'s','Eggs':'e','Milk':'d','Soy':'y'};

function dietsOf(f,prot){
  const d=[];
  const meat=/[mk]/.test(f), fish=/[fs]/.test(f);
  if(!meat&&!fish) d.push(/[deh]/.test(f)?'Vegetarian':'Vegan');
  else if(!meat) d.push('Pescatarian');
  if(!f.includes('g')) d.push('Gluten-free');
  if(!f.includes('d')) d.push('Dairy-free');
  if(!/[np]/.test(f)) d.push('Nut-free');
  if(!/[kq]/.test(f)) d.push('Halal-friendly');
  if(prot>=25) d.push('High-protein');
  return d;
}
function buildRecipe(r){
  const fl=new Set(); let prot=0;
  r.ings.forEach(x=>{const g=ING[x.id];for(const c of g.fl)fl.add(c);prot+=g.u==='ea'?x.q*g.pr:x.q*g.pr/100});
  r.f=[...fl].join('');
  r.prot=Math.round(prot/r.serv);
  r.diets=dietsOf(r.f,r.prot);
  return r;
}

/* Recipe format: R(id,name,cuisines,servings,totalMinutes,level 1-3,art,description,ingredients,steps)
   ingredient: "catalogId|quantity in catalog unit|display text"; step: "text ~minutes" */
const BASE_RECIPES=[];
function R(id,name,cuis,serv,time,lvl,art,desc,ings,steps){
  BASE_RECIPES.push(buildRecipe({id,name,cuis,serv,time,lvl,art,desc,
    ings:ings.map(s=>{const [i,q,d]=s.split('|');return {id:i,q:+q,d}}),
    steps:steps.map(s=>{const m=s.match(/^(.*?)\s*~(\d+)$/);return m?{t:m[1],m:+m[2]}:{t:s,m:0}})}));
}

 ['Heat the oil in a big pot over medium. Cook the onion and pepper until soft. ~6','Add the turkey and cook, breaking it up, until no pink remains. ~7','Stir in garlic, chili powder, cumin and salt for 1 minute. ~1','Add the tomatoes, drained beans and corn. Bring to a simmer, then reduce the heat and cook with the lid half on, stirring now and then. ~25','Taste and adjust the salt. It gets better the next day.']);

R('black-bean-quesadillas','Black Bean & Cheese Quesadillas',['Mexican','Fast food alternatives'],3,20,1,'wrap',
 'Crispy, melty and ready in 20 minutes. A student classic for good reason.',
 ['tortillas|6|6 flour tortillas','black_beans|240|1 can (240 g drained) black beans','cheddar|150|1½ cups (150 g) shredded cheddar','salsa|125|½ cup salsa, plus extra to serve','cumin|2|¾ tsp ground cumin','veg_oil|15|1 tbsp vegetable oil'],
 ['Mash half the beans with a fork. Mix with the whole beans, cumin and salsa.','Lay 3 tortillas flat. Spread with the bean mix, sprinkle with cheese and cover with the other tortillas.','Heat a little oil in a large pan on medium. Cook each quesadilla until golden and the cheese melts, about 3 minutes per side. ~6','Cut into wedges and serve with extra salsa.']);

R('chicken-burrito-bowls','Chicken Burrito Bowls',['Mexican','Healthy meals'],4,35,1,'bowl',
 'Everything you love about a burrito shop bowl, cooked at home for a fraction of the price.',
 ['chicken_breast|500|500 g chicken breast, sliced thin','rice|240|1 cup (240 g) dry white rice','black_beans|240|1 can (240 g drained) black beans','corn|170|½ can (170 g) corn','salsa|190|¾ cup salsa','avocado|1|1 avocado, sliced','lime|1|1 lime','chili_powder|10|2 tsp chili powder','cumin|5|2 tsp ground cumin','veg_oil|15|1 tbsp vegetable oil','salt|3|½ tsp salt'],
 ['Cook the rice in 2 cups (480 ml) water with a pinch of salt. Bring to a boil, cover and simmer on low. ~18','Toss the chicken with chili powder, cumin and salt.','Heat the oil in a pan on medium-high. Cook the chicken until golden and cooked through. ~8','Warm the beans and corn together in a small pot or in the microwave. ~3','Squeeze lime into the rice. Build bowls with rice, chicken, beans, corn, salsa and avocado.']);

R('coconut-chickpea-curry','Creamy Coconut Chickpea Curry',['Indian','Healthy meals'],4,35,1,'soup',
 'Mild, creamy and fully plant-based. Cheap, filling and gluten-free when served over rice.',
 ['chickpeas|480|2 cans (480 g drained) chickpeas','coconut_milk|400|1 can (400 ml) coconut milk','diced_tomatoes|400|1 cup (400 ml) canned diced tomatoes','onion|1|1 onion, diced','garlic|3|3 garlic cloves, minced','ginger|10|2 tsp grated fresh ginger','curry_powder|15|1 tbsp curry powder','spinach|100|a big handful (100 g) baby spinach','rice|240|1 cup (240 g) dry white rice','veg_oil|15|1 tbsp vegetable oil','salt|3|½ tsp salt'],
 ['Start the rice in 2 cups (480 ml) water. Bring to a boil, cover and simmer on low. ~18','Heat the oil in a deep pan on medium. Cook the onion until soft, then add garlic, ginger and curry powder for 1 minute. ~7','Add the tomatoes, coconut milk, chickpeas and salt. Simmer gently, stirring now and then, until slightly thickened. ~15','Stir in the spinach until wilted. ~2','Serve over rice.']);

R('red-lentil-dal','Red Lentil Dal',['Indian','Healthy meals'],4,30,1,'soup',
 'Red lentils melt into a silky, spiced stew in 20 minutes. Probably the cheapest dinner in the app.',
 ['lentils|250|1⅓ cups (250 g) dry red lentils','onion|1|1 onion, diced','garlic|3|3 garlic cloves, minced','ginger|10|2 tsp grated fresh ginger','curry_powder|15|1 tbsp curry powder','diced_tomatoes|400|1 cup (400 ml) canned diced tomatoes','rice|240|1 cup (240 g) dry white rice, to serve','veg_oil|15|1 tbsp vegetable oil','lemon|0.5|½ lemon','salt|4|¾ tsp salt'],
 ['Rinse the lentils in a sieve until the water runs mostly clear.','Heat the oil in a pot on medium. Cook the onion until soft, then add garlic, ginger and curry powder for 1 minute. ~6','Add the lentils, tomatoes, 3 cups (720 ml) water and salt. Bring to a boil, then simmer with the lid slightly open, stirring often, until thick and creamy. ~20','Meanwhile cook the rice in 2 cups (480 ml) water. ~18','Squeeze in the lemon juice, taste and add salt if needed. Serve over rice.']);

R('easy-coconut-chicken-curry','Easy Coconut Chicken Curry',['Indian'],4,40,2,'bowl',
 'Tender chicken thighs in a rich, gently spiced coconut sauce.',
 ['chicken_thigh|600|600 g boneless chicken thighs, cubed','coconut_milk|400|1 can (400 ml) coconut milk','onion|1|1 onion, diced','garlic|3|3 garlic cloves, minced','ginger|10|2 tsp grated fresh ginger','curry_powder|20|4 tsp curry powder','tomato_paste|30|2 tbsp tomato paste','rice|240|1 cup (240 g) dry white rice','veg_oil|15|1 tbsp vegetable oil','salt|4|¾ tsp salt'],
 ['Start the rice in 2 cups (480 ml) water. Bring to a boil, cover and simmer on low. ~18','Heat the oil in a deep pan on medium-high. Brown the chicken in a single layer for 2 minutes per side. Move to a plate. ~5','Lower the heat to medium. Cook the onion until soft, then add garlic, ginger, curry powder and tomato paste for 1 minute. ~6','Pour in the coconut milk and salt, scraping up the browned bits. Return the chicken. Simmer, partly covered, until the chicken is cooked through and the sauce thickens. Cut one piece open to check there is no pink. ~15','Serve over rice.']);

R('greek-chickpea-salad','Greek Chickpea Salad',['Mediterranean','Healthy meals'],3,15,1,'salad',
 'Fresh, crunchy and no cooking at all. Great for packed lunches.',
 ['chickpeas|480|2 cans (480 g drained) chickpeas, rinsed','cucumber|1|1 cucumber, diced','tomato|250|2 tomatoes, diced','onion|0.5|½ onion, very thinly sliced','feta|100|½ cup (100 g) crumbled feta','olive_oil|45|3 tbsp olive oil','lemon|1|1 lemon, juiced','italian|2|1 tsp dried oregano or Italian seasoning','salt|2|¼ tsp salt'],
 ['Soak the sliced onion in cold water for 5 minutes to mellow it, then drain. ~5','Whisk the olive oil, lemon juice, oregano and salt in a large bowl.','Add the chickpeas, cucumber, tomato and onion and toss to coat.','Top with feta. Eat now, or chill for up to 2 days.']);

R('easy-shakshuka','Easy Shakshuka',['Middle Eastern','Healthy meals'],3,30,2,'egg',
 'Eggs poached in a spiced tomato and pepper sauce. Mop it up with toast.',
 ['eggs|6|6 eggs','diced_tomatoes|796|1 large can (796 ml) diced tomatoes','onion|1|1 onion, diced','bell_pepper|1|1 bell pepper, diced','garlic|3|3 garlic cloves, minced','cumin|5|2 tsp ground cumin','paprika|5|2 tsp smoked paprika','olive_oil|30|2 tbsp olive oil','salt|3|½ tsp salt','bread|3|3 slices bread, toasted, to serve'],
 ['Heat the oil in a wide pan on medium. Cook the onion and pepper until soft. ~7','Stir in garlic, cumin and paprika for 1 minute. ~1','Add the tomatoes and salt. Simmer until thickened. ~10','Make 6 little wells in the sauce with a spoon and crack an egg into each. Cover and cook on low until the whites are set. The yolks can stay soft. ~6','Serve straight from the pan with toast.']);

R('lemon-chicken-couscous','Lemon Herb Chicken with Couscous',['Mediterranean','Healthy meals'],3,30,2,'bowl',
 'Bright lemony chicken with zucchini and fluffy couscous. Ready in half an hour.',
 ['chicken_breast|450|450 g chicken breast, sliced into strips','couscous|200|1 cup (200 g) couscous','broth|250|1 cup (250 ml) vegetable broth','zucchini|200|1 zucchini, diced','lemon|1|1 lemon, zest and juice','garlic|3|3 garlic cloves, minced','italian|5|2 tsp Italian seasoning','olive_oil|30|2 tbsp olive oil','salt|3|½ tsp salt'],
 ['Toss the chicken with half the lemon juice, the Italian seasoning, garlic and salt.','Heat the oil in a large pan on medium-high. Cook the chicken until golden and cooked through. ~8','Add the zucchini and cook until just tender. ~4','Meanwhile, bring the broth to a boil, stir in the couscous, cover, take off the heat and rest for 5 minutes. Fluff with a fork. ~6','Mix the lemon zest and remaining juice into the couscous. Serve the chicken and zucchini on top.']);

R('spiced-chickpea-rice','Spiced Chickpea & Rice Plate',['Middle Eastern','Healthy meals'],3,30,1,'bowl',
 'Warm cumin-and-paprika chickpeas over rice with cool cucumber. Plant-based and budget-friendly.',
 ['chickpeas|480|2 cans (480 g drained) chickpeas','rice|200|1 cup (200 g) dry white rice','onion|1|1 onion, diced','garlic|3|3 garlic cloves, minced','cumin|5|2 tsp ground cumin','paprika|5|2 tsp smoked paprika','olive_oil|30|2 tbsp olive oil','lemon|0.5|½ lemon','cucumber|1|1 cucumber, diced','salt|3|½ tsp salt'],

R('lemon-tuna-pasta','Lemon Tuna Pasta',['Italian','Mediterranean'],3,20,1,'pasta',
 'Pantry-staple pasta with lemon, garlic and spinach. Protein-rich and very cheap.',
 ['pasta|300|300 g spaghetti','tuna|340|2 cans (340 g) tuna, drained','lemon|1|1 lemon, zest and juice','garlic|2|2 garlic cloves, minced','olive_oil|30|2 tbsp olive oil','spinach|60|2 big handfuls (60 g) baby spinach','salt|8|2 tsp salt for the pasta water','pepper|1|¼ tsp black pepper','parmesan|20|¼ cup grated parmesan'],
 ['Boil the spaghetti in salted water until tender. Save ½ cup pasta water, then drain. ~10','In a large pan, warm the oil and garlic on low for 1 minute. ~1','Add the spinach, tuna, lemon zest and juice and stir until the spinach wilts. ~2','Add the pasta and a splash of pasta water and toss. Finish with pepper and parmesan. ~2']);

R('sheet-pan-salmon','Sheet-Pan Salmon, Potatoes & Broccoli',['Healthy meals','American'],2,35,1,'bake',
 'A full dinner on one pan with almost no cleanup. Omega-3-rich and a little treat.',
 ['salmon|300|2 salmon fillets (300 g)','potato|450|450 g potatoes, cut in small cubes','broccoli|250|250 g broccoli florets','olive_oil|30|2 tbsp olive oil','lemon|0.5|½ lemon','garlic|2|2 garlic cloves, minced','paprika|3|1 tsp smoked paprika','salt|3|½ tsp salt','pepper|1|¼ tsp black pepper'],
 ['Heat the oven to 220°C (425°F). Toss the potatoes with half the oil, half the salt and the paprika on a large baking sheet. Roast. ~15','Toss the broccoli with the rest of the oil and garlic. Push the potatoes aside and add the broccoli to the pan.','Pat the salmon dry and season with remaining salt and pepper. Nestle on the pan. Roast until the salmon flakes easily and the potatoes are golden. ~12','Squeeze lemon over everything and serve.']);

R('veggie-omelette-toast','Veggie Omelette & Toast',['American','Healthy meals'],2,15,1,'egg',
 'Fast, high-protein and works for breakfast, lunch or dinner.',
 ['eggs|4|4 eggs','mushrooms|100|100 g mushrooms, sliced','bell_pepper|0.5|½ bell pepper, diced','cheddar|40|⅓ cup (40 g) shredded cheddar','butter|10|2 tsp butter','bread|4|4 slices bread','salt|2|¼ tsp salt','pepper|1|pinch of black pepper'],
 ['Whisk the eggs with salt and pepper.','Melt half the butter in a nonstick pan on medium. Cook the mushrooms and pepper until soft, then move to a plate. ~4','Melt the remaining butter and pour in the eggs. As they set, gently pull the edges toward the centre so uncooked egg flows underneath. ~3','Add the veg and cheese to one half, fold over and slide onto a plate. Serve with toast. ~2']);

R('pb-banana-oatmeal','Peanut Butter Banana Oatmeal',['American','Healthy meals'],2,10,1,'bowl',
 'Creamy oats with peanut butter and banana. It keeps you full all morning for under a dollar.',
 ['oats|90|1 cup (90 g) rolled oats','milk|500|2 cups (500 ml) milk','banana|2|2 bananas, sliced','peanut_butter|32|2 tbsp peanut butter','honey|15|1 tbsp honey'],
 ['Add the oats and milk to a small pot and bring to a gentle simmer on medium. ~2','Cook, stirring often, until thick and creamy. ~5','Stir in half the peanut butter. Divide between bowls and top with banana, the rest of the peanut butter and a drizzle of honey. ~1']);

R('chicken-caesar-wraps','Chicken Caesar Wraps',['Fast food alternatives','American'],3,25,1,'wrap',
 'A better-than-the-drive-thru lunch you can pack and eat cold.',
 ['chicken_breast|350|350 g chicken breast, sliced thin','tortillas|3|3 large flour tortillas','romaine|170|half a pack (170 g) romaine, chopped','caesar_dressing|60|¼ cup Caesar dressing','parmesan|25|¼ cup grated parmesan','olive_oil|15|1 tbsp olive oil','salt|2|¼ tsp salt','pepper|1|¼ tsp black pepper'],
 ['Season the chicken with salt and pepper.','Heat the oil in a pan on medium-high. Cook the chicken until golden and cooked through. ~8','Toss the romaine with the dressing and half the parmesan.','Warm the tortillas for 20 seconds per side. Fill with lettuce and chicken, sprinkle with the remaining parmesan and roll tightly. ~2','Cut each wrap in half to serve.']);

R('smash-burger-bowls','Smash Burger Bowls',['Fast food alternatives','American'],3,35,1,'bowl',
 'Burger-night flavours without the buns: seasoned beef, crispy potato wedges and a crunchy salad.',
 ['ground_beef|454|454 g (1 lb) lean ground beef','potato|450|450 g potatoes, cut in wedges','romaine|170|half a pack (170 g) romaine, chopped','tomato|200|1–2 tomatoes, diced','onion|0.5|½ onion, diced','cheddar|75|¾ cup (75 g) shredded cheddar','veg_oil|30|2 tbsp vegetable oil','paprika|3|1 tsp smoked paprika','salt|4|¾ tsp salt'],
 ['Heat the oven to 220°C (425°F). Toss the potato wedges with half the oil, paprika and half the salt. Roast, flipping once. ~25','Shape the beef into 6 thin patties and season with the remaining salt.','Heat the remaining oil in a pan on high. Cook the patties 2–3 minutes per side until browned and cooked through, topping with cheese in the last minute. ~6','Build bowls with lettuce, tomato, onion, wedges and chopped patties.']);

R('sheet-pan-chicken-veg','Sheet-Pan Chicken & Veggies',['Healthy meals','American'],4,40,1,'bake',
 'Toss everything on a tray, roast and you are done. Easy meal-prep for the week.',
 ['chicken_thigh|600|600 g boneless chicken thighs','sweet_potato|450|450 g sweet potatoes, cubed','broccoli|300|300 g broccoli florets','carrot|200|2–3 carrots, sliced','olive_oil|45|3 tbsp olive oil','paprika|5|2 tsp smoked paprika','garlic|3|3 garlic cloves, minced','salt|4|¾ tsp salt','pepper|1|¼ tsp black pepper'],
 ['Heat the oven to 220°C (425°F). Toss the sweet potato and carrot with half the oil and half the salt on a large tray. Roast. ~10','Toss the chicken with the remaining oil, paprika, garlic, salt and pepper.','Add the chicken and broccoli to the tray. Roast until the chicken reaches 74°C (165°F) or the juices run clear. ~25','Rest for 5 minutes before serving.']);

R('naan-flatbread-pizzas','Naan Flatbread Pizzas',['Italian','Fast food alternatives'],4,20,1,'pizza',
 'Crispy naan as a speedy pizza base. Much cheaper than delivery and ready faster.',
 ['naan|4|4 naan breads','pasta_sauce|180|¾ cup (180 ml) tomato pasta sauce','mozzarella|200|2 cups (200 g) shredded mozzarella','bell_pepper|1|1 bell pepper, sliced thin','mushrooms|100|100 g mushrooms, sliced','italian|3|1 tsp Italian seasoning','olive_oil|10|2 tsp olive oil'],

R('loaded-baked-potatoes','Loaded Baked Potatoes',['American'],3,60,1,'bake',
 'Fluffy potatoes topped with cheese, broccoli and creamy yogurt. Cozy and filling.',
 ['potato|900|3 large potatoes (900 g)','cheddar|100|1 cup (100 g) shredded cheddar','broccoli|200|200 g broccoli, small florets','yogurt|100|½ cup (100 g) plain Greek yogurt','green_onion|20|2 green onions, sliced','olive_oil|10|2 tsp olive oil','salt|4|¾ tsp salt'],
 ['Heat the oven to 200°C (400°F). Scrub the potatoes, prick them all over with a fork, rub with oil and salt, and bake directly on the rack. ~50','About 5 minutes before they finish, steam or microwave the broccoli with a splash of water until tender. ~4','Slice each potato open and fluff the inside with a fork.','Top with cheese, broccoli, a spoonful of yogurt and green onions.']);

R('cheesy-broccoli-pasta','Cheesy Broccoli Pasta',['American','Fast food alternatives'],4,30,2,'pasta',
 'A from-scratch cheese sauce that beats the boxed stuff. Broccoli is hidden in plain sight.',
 ['pasta|300|300 g spaghetti, broken in halves','broccoli|250|250 g broccoli, small florets','milk|500|2 cups (500 ml) milk','butter|30|2 tbsp butter','flour|30|¼ cup (30 g) flour','cheddar|200|2 cups (200 g) shredded cheddar','salt|5|1 tsp salt'],
 ['Boil the pasta in salted water. Add the broccoli for the last 2 minutes, then drain both. ~10','In the same pot, melt the butter on medium. Whisk in the flour and cook for 1 minute. ~2','Slowly pour in the milk while whisking. Cook, stirring, until it coats the back of a spoon. ~5','Turn the heat off. Stir in the cheese until smooth and season with salt.','Add the pasta and broccoli back in and stir to coat.']);

R('lentil-carrot-soup','Hearty Lentil & Carrot Soup',['Mediterranean','Healthy meals'],4,40,1,'soup',
 'Warming, thick and cheap. Make a pot on Sunday and eat all week.',
 ['lentils|200|1 cup (200 g) dry red lentils','carrot|300|3 carrots, diced','onion|1|1 onion, diced','garlic|3|3 garlic cloves, minced','broth|900|1 carton (900 ml) vegetable broth','cumin|5|2 tsp ground cumin','lemon|0.5|½ lemon','olive_oil|30|2 tbsp olive oil','salt|4|¾ tsp salt'],
 ['Heat the oil in a large pot on medium. Cook the onion and carrots until the onion is soft. ~8','Add garlic and cumin for 1 minute. ~1','Add the rinsed lentils, broth and 2 cups (480 ml) water. Bring to a boil, then simmer until the lentils and carrots are very soft. ~22','Blend part of the soup with a blender or mash with a potato masher for a thicker texture.','Stir in lemon juice and salt to taste.']);

R('tomato-soup-grilled-cheese','Tomato Soup & Grilled Cheese',['American'],3,30,1,'soup',
 'A rainy-day classic made with a can of tomatoes and a hot pan.',
 ['diced_tomatoes|796|1 large can (796 ml) diced tomatoes','onion|1|1 onion, diced','garlic|2|2 garlic cloves, minced','broth|250|1 cup (250 ml) vegetable broth','butter|30|2 tbsp butter, divided','bread|6|6 slices bread','cheddar|150|1½ cups (150 g) shredded cheddar','salt|3|½ tsp salt','pepper|1|¼ tsp black pepper'],
 ['Melt 1 tbsp butter in a pot on medium. Cook the onion until soft, then add garlic for 30 seconds. ~6','Add tomatoes, broth, salt and pepper. Simmer. ~12','Blend until smooth with a blender, or mash well with a potato masher for a rustic soup.','Butter one side of each bread slice with the remaining butter. Fill with cheese, buttered side out, and toast in a pan on medium-low until golden and melted. ~8','Serve the sandwiches with the soup for dipping.']);

R('garlic-shrimp-noodles','Garlic Shrimp Noodles',['Asian'],3,20,2,'pasta',

 ['shrimp|340|340 g peeled frozen shrimp, thawed','noodles|250|250 g wheat noodles','frozen_veg|150|1 cup (150 g) frozen mixed vegetables','garlic|5|5 garlic cloves, minced','soy_sauce|30|2 tbsp soy sauce','butter|30|2 tbsp butter','green_onion|20|2 green onions, sliced','lime|1|1 lime'],
 ['Cook the noodles according to the package. Drain. ~6','Melt the butter in a large pan on medium-high. Add the shrimp and cook until pink and curled, about 2 minutes per side. Move to a plate. ~4','In the same pan, cook the garlic for 30 seconds, then add the vegetables for 3 minutes. ~4','Add the noodles, soy sauce and shrimp and toss well. ~1','Top with green onions and a squeeze of lime.']);

R('peanut-noodles','Peanut Noodles with Veggies',['Asian'],3,20,1,'pasta',
 'Creamy, nutty and totally plant-based. Delicious warm or cold.',
 ['noodles|250|250 g wheat noodles','peanut_butter|60|¼ cup (60 g) peanut butter','soy_sauce|45|3 tbsp soy sauce','lime|1|1 lime, juiced','garlic|2|2 garlic cloves, minced','carrot|100|1 large carrot, grated','cucumber|1|1 cucumber, sliced into half-moons','ginger|5|1 tsp grated fresh ginger'],

R('sweet-potato-black-bean-tacos','Sweet Potato & Black Bean Tacos',['Mexican','Healthy meals'],3,35,1,'wrap',
 'Smoky roasted sweet potato and black beans in warm tortillas. Plant-based and satisfying.',
 ['tortillas|6|6 flour tortillas','sweet_potato|450|450 g sweet potatoes, small cubes','black_beans|240|1 can (240 g drained) black beans','avocado|1|1 avocado, sliced','lime|1|1 lime','cumin|5|2 tsp ground cumin','chili_powder|5|2 tsp chili powder','olive_oil|15|1 tbsp olive oil','salsa|125|½ cup salsa','salt|3|½ tsp salt'],
 ['Heat the oven to 220°C (425°F). Toss the sweet potato with oil, cumin, chili powder and salt on a baking sheet. Roast, stirring once. ~25','Warm the beans in a small pot. Mash a few for a thicker filling. ~3','Warm the tortillas in a dry pan for 20 seconds per side.','Fill with sweet potato, beans, avocado and salsa and finish with lime juice.']);

R('bacon-egg-spaghetti','Bacon & Egg Spaghetti',['Italian'],3,25,2,'pasta',

 ['Boil the spaghetti in salted water. Save 1 cup of pasta water, then drain. ~10','Cook the bacon in a large pan on medium until crisp. Add the garlic for 30 seconds. ~7','Whisk the eggs, parmesan and pepper in a bowl.','Take the pan off the heat. Add the hot pasta, then the egg mix and toss quickly, adding splashes of pasta water until creamy. The heat from the pasta cooks the eggs. ~2','Serve immediately with extra pepper.']);

R('chicken-shawarma-bowls','Chicken Shawarma Bowls',['Middle Eastern'],4,40,2,'bowl',
 'Warmly spiced chicken, rice, fresh veg and garlicky yogurt sauce.',
 ['chicken_thigh|600|600 g boneless chicken thighs, sliced','rice|240|1 cup (240 g) dry white rice','cucumber|1|1 cucumber, diced','tomato|250|2 tomatoes, diced','yogurt|150|⅔ cup (150 g) plain Greek yogurt','garlic|3|3 garlic cloves, minced','cumin|5|2 tsp ground cumin','paprika|5|2 tsp smoked paprika','curry_powder|5|1 tsp curry powder','lemon|1|1 lemon','olive_oil|30|2 tbsp olive oil','salt|4|¾ tsp salt'],

R('roasted-veggie-quinoa-bowl','Roasted Veggie Quinoa Bowl',['Healthy meals','Mediterranean'],3,40,1,'bowl',
 'Nutty quinoa, roasted veg and crispy chickpeas with a lemon dressing. Plant-based and gluten-free.',
 ['quinoa|180|1 cup (180 g) quinoa, rinsed','sweet_potato|300|300 g sweet potato, cubed','zucchini|200|1 zucchini, sliced','chickpeas|240|1 can (240 g drained) chickpeas','spinach|60|2 big handfuls (60 g) baby spinach','olive_oil|30|2 tbsp olive oil','lemon|1|1 lemon','cumin|3|1 tsp ground cumin','salt|3|½ tsp salt'],
 ['Heat the oven to 220°C (425°F). Toss the sweet potato, zucchini and dried chickpeas with half the oil, cumin and half the salt. Roast. ~25','Cook the quinoa in 2 cups (480 ml) water. Bring to a boil, cover and simmer on low, then rest off the heat for 5 minutes. ~20','Whisk the remaining oil with the lemon juice and salt.','Fluff the quinoa, fold in the spinach so it wilts, then top with the roasted veg and dressing.']);

R('spinach-mushroom-frittata','Spinach & Mushroom Frittata',['Healthy meals','Mediterranean'],4,30,2,'egg',
 'Fluffy, protein-packed and perfect cold the next day. Gluten-free and low-carb.',
 ['eggs|8|8 eggs','spinach|120|120 g baby spinach','mushrooms|150|150 g mushrooms, sliced','onion|0.5|½ onion, diced','feta|60|⅓ cup (60 g) crumbled feta','olive_oil|15|1 tbsp olive oil','salt|3|½ tsp salt','pepper|1|¼ tsp black pepper'],
 ['Heat the oven to 190°C (375°F). Whisk the eggs with salt and pepper.','Heat the oil in an oven-safe pan on medium. Cook the onion and mushrooms until golden. ~7','Add the spinach and stir until wilted. ~2','Pour in the eggs and scatter the feta on top. Cook without stirring until the edges set. ~3','Transfer to the oven and bake until the centre is set. ~12','Rest for 5 minutes, then slice into wedges.']);

R('honey-soy-chicken-thighs','Honey Soy Chicken Thighs',['Asian'],4,35,1,'bake',

/* ================= PRICES =================
   PriceProvider is the single seam for real grocery data. Swap `offers` for an
   API-backed implementation that returns the same shape and nothing else changes. */
const STORE_NAME=Object.fromEntries(STORES.map(s=>[s.id,s.name]));
const STORE_ADJ={
  walmart:{Produce:1,'Meat & seafood':.96,Fridge:.97,'Grains & bread':.95,Pantry:.93,Frozen:.98},
  nofrills:{Produce:.97,'Meat & seafood':.97,Fridge:.94,'Grains & bread':.92,Pantry:.95,Frozen:.95},
  freshco:{Produce:.92,'Meat & seafood':1.02,Fridge:1,'Grains & bread':1.03,Pantry:1.02,Frozen:1},
  foodbasics:{Produce:.95,'Meat & seafood':1,Fridge:.99,'Grains & bread':.98,Pantry:.98,Frozen:.97},
  metro:{},loblaws:{}
};
const STORE_FLAT={metro:1.08,loblaws:1.12};
const COSTCO_MULT={Produce:2,'Meat & seafood':3,Fridge:2,'Grains & bread':3,Pantry:3,Frozen:2};
function pkgLabel(ing,size){
  const t=n=>+(n).toFixed(2);
  if(ing.u==='g')return size>=1000?t(size/1000)+' kg':size+' g';
  if(ing.u==='ml')return size>=1000?t(size/1000)+' L':size+' ml';
  return size+' '+ing.lab;
}
const PriceProvider={
  label:'Sample prices (demo data)',
  live:false,
  offer(ing,sid){
    if(['costco','metro','loblaws','freshco'].includes(sid)&&hash('stock|'+ing.id+sid)<.07)return null;
    const noise=1+(hash('n|'+ing.id+sid)-.5)*.34;
    let size=ing.size,price;
    if(sid==='costco'){const m=ing.staple?4:(COSTCO_MULT[ing.cat]||2);size=ing.size*m;price=ing.price*m*.8*noise}
    else price=ing.price*(STORE_ADJ[sid][ing.cat]??STORE_FLAT[sid]??1)*noise;
    price=Math.max(.49,Math.round(price*10)/10-.01);
    return {store:sid,price,size,pkg:pkgLabel(ing,size),perUnit:price/size};
  },
  offers(ingId,storeIds){
    const ing=ING[ingId];
    let list=storeIds.map(s=>this.offer(ing,s)).filter(Boolean),fb=false;
    if(!list.length){list=STORES.map(s=>this.offer(ing,s.id)).filter(Boolean);fb=true}
    list.fb=fb;return list;
  }
};
const activeStores=()=>{const s=STORES.map(x=>x.id).filter(id=>S.prof.stores.includes(id));return s.length?s:DEFAULT_STORES};

const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const _est=new Map();
function estimate(r){
  const st=activeStores(),key=r.id+'|'+st.join(',');
  if(_est.has(key))return _est.get(key);
  let used=0,pkg=0;
  const lines=r.ings.map(x=>{const off=PriceProvider.offers(x.id,st);const u=avg(off.map(o=>o.perUnit*x.q)),p=median(off.map(o=>o.price));used+=u;pkg+=p;return {x,used:u,pkg:p}});
  const out={used,pkg,perServ:used/r.serv,lines};_est.set(key,out);return out;
}
function compare(r,mode){
  const st=activeStores();
  const rows=r.ings.map(x=>{
    const ing=ING[x.id],off=PriceProvider.offers(x.id,st);
    const list=off.map(o=>({...o,used:o.perUnit*x.q,val:mode==='used'?o.perUnit*x.q:o.price}))
      .sort((a,b)=>a.val-b.val||st.indexOf(a.store)-st.indexOf(b.store));
    const comparable=mode==='used'?list:list.filter(o=>o.size===ing.size),best=list[0],mean=avg((comparable.length?comparable:list).map(o=>o.val));
    return {x,ing,list,best,mean,save:Math.max(0,mean-best.val),fb:off.fb};
  });
  const total=rows.reduce((s,w)=>s+w.best.val,0),typical=rows.reduce((s,w)=>s+w.mean,0);
  const singles=st.map(sid=>{let t=0,ok=true;rows.forEach(w=>{const o=w.list.find(o=>o.store===sid);if(!o)ok=false;else t+=o.val});return ok?{store:sid,total:t}:null}).filter(Boolean).sort((a,b)=>a.total-b.total);
  return {rows,total,typical,save:Math.max(0,typical-total),singles,stops:new Set(rows.map(w=>w.best.store)).size,
    checkout:rows.reduce((s,w)=>s+w.best.price,0),usedTotal:rows.reduce((s,w)=>s+w.best.used,0),stores:st,
    anyFallback:rows.some(w=>w.fb)};
}

const allRecipes=()=>BASE_RECIPES.concat(S.gen);
const recipeById=id=>allRecipes().find(r=>r.id===id);
function flagsAllowed(f){
  const p=S.prof;
  for(const a of p.allergies){const c=ALLERGY[a];if(c&&f.includes(c))return false}
  for(const d of p.diet){const fn=DIET_OK[d];if(fn&&!fn(f))return false}
  return true;
}
function allowed(r){
  if(!flagsAllowed(r.f))return false;
  const kw=S.prof.avoid.map(s=>s.toLowerCase().trim()).filter(Boolean);
  if(kw.length){const hay=(r.name+' '+r.ings.map(x=>ING[x.id].name+' '+x.d).join(' ')).toLowerCase();if(kw.some(k=>hay.includes(k)))return false}
  return true;
}
const BUDGETS={'u5':{label:'Under $5',sub:'per serving',cap:5},'5-10':{label:'$5–$10',sub:'per serving',cap:10},'10-15':{label:'$10–$15',sub:'per serving',cap:15},'15+':{label:'$15+',sub:'per serving',cap:Infinity}};
function budgetCap(){const p=S.prof;if(p.budget==='custom'){const v=parseFloat(p.custom);return v>0?v:Infinity}return BUDGETS[p.budget]?.cap??Infinity}
const budgetLabel=()=>S.prof.budget==='custom'?(parseFloat(S.prof.custom)>0?'Up to '+money(parseFloat(S.prof.custom))+' per serving':'Custom'):BUDGETS[S.prof.budget].label+' per serving';
const TIMES={'15':{label:'Under 15 minutes',max:15},'30':{label:'15–30 minutes',max:30},'45':{label:'30–45 minutes',max:45},'60':{label:'45+ minutes',max:999}};
const EXP={Beginner:1,Intermediate:2,Advanced:3};
function scoreRecipe(r){
  const p=S.prof;let s=0;
  if(r.cuis.some(c=>p.cuisines.includes(c)))s+=3;
  const tm=TIMES[p.time]?.max??999;
  s+=r.time<=tm?1:-Math.min(3,(r.time-tm)/10);
  const ex=EXP[p.exp]||1;s-=Math.max(0,r.lvl-ex)*2;
  if(p.diet.includes('High-protein')&&r.prot>=25)s+=2;
  const cap=budgetCap();if(isFinite(cap))s+=Math.max(0,1-estimate(r).perServ/cap);
  return s;
}
function eligible(relax=1){
  const cap=budgetCap();
  return allRecipes().filter(r=>allowed(r)&&(estimate(r).perServ<=cap*relax));
}
function basePool(){
  let pool=eligible(1);
  if(pool.length<6)pool=eligible(1.3);
  if(pool.length<6)pool=eligible(Infinity);
  return pool;
}
function weightedPick(list,k){
  return list.map(r=>({r,s:scoreRecipe(r)+Math.random()*2.4})).sort((a,b)=>b.s-a.s).slice(0,k).map(x=>x.r);
}
async function buildRecs(n=6,fresh=false){
  let pool=basePool(),unseen=pool.filter(r=>!S.seen.includes(r.id));
  let note='';
  if(fresh&&unseen.length<n&&AI.available()){
    U.genBusy=true;
    try{const k=await aiGenerate(4);if(k)note='GrowAI created '+k+' new recipe'+(k>1?'s':'')+' for you.'}catch(e){}
    U.genBusy=false;
    pool=basePool();unseen=pool.filter(r=>!S.seen.includes(r.id));
  }
  let pick=weightedPick(unseen,Math.min(n,unseen.length));
  if(pick.length<n){
    const keep=new Set(pick.map(r=>r.id).concat(S.rec.ids||[]));
    pick=pick.concat(weightedPick(pool.filter(r=>!keep.has(r.id)),n-pick.length));
    if(pick.length<n){const have=new Set(pick.map(r=>r.id));pick=pick.concat(weightedPick(pool.filter(r=>!have.has(r.id)),n-pick.length))}
    if(unseen.length===0)S.seen=[];
    note=note||'You have seen every recipe that matches your settings, so we are starting a fresh round.';
  }
  S.seen=Array.from(new Set(S.seen.concat(pick.map(r=>r.id))));
  S.rec={ids:pick.map(r=>r.id),note};
  save();
  return pick;
}

Ingredients: ${r.ings.map(x=>x.d).join('; ')}.
Steps: ${r.steps.map((s,i)=>(i+1)+'. '+s.t).join(' ')}`;
}
const CHAT_RULES=`You are GrowAI, the friendly cooking assistant inside GrowRecipes, a meal-planning app for university and college students.
Give practical, easy-to-follow answers. Keep replies short (about 60-150 words) unless asked for detail. Plain language, no jargon. Give metric and imperial when you give amounts or temperatures.
The user's allergies are STRICT: never suggest an ingredient that contains any of them, and respect every dietary restriction listed. If a swap changes the result, say how in one short line.
Prefer cheap, easy-to-find ingredients. Do not invent grocery prices or claim live store data. The app's prices are sample demo prices and the app has a "Find cheapest ingredients" button on recipe pages.
Food safety matters: mention safe cooking temperatures when relevant (chicken 74°C / 165°F).
Format: short paragraphs or "- " bullet lists. Use **bold** sparingly for key words. No headings, no tables.`;
async function askAI(turns,onText,signal){
  const ctxR=S.ctx?recipeById(S.ctx):null;
  const intro=CHAT_RULES+'\n\nUser profile (JSON): '+JSON.stringify(profileSummary())+(ctxR?'\n\n'+recipeSummary(ctxR):'\n\nThe user is not viewing a specific recipe.');
  const hist=turns.slice(-10).map(m=>({role:m.role,content:m.text}));
  while(hist.length&&hist[0].role!=='user')hist.shift();
  const r=await AI.sample([{role:'user',content:intro+'\n\nThe conversation follows. Reply to the last user message.'},...hist],{cache:false,modelTier:'quick',signal,onText:({text})=>onText(text)});
  return r.text;
}

async function aiGenerate(n=4){
  if(!AI.sample)return 0;
  const p=S.prof,cap=budgetCap(),tm=TIMES[p.time]?.max??999;
  const catalog=Object.values(ING).map(i=>`${i.id} (${i.name}; ${i.u}${i.fl?'; flags '+i.fl:''})`).join(', ');
  const names=allRecipes().map(r=>r.name).join('; ');
  const prompt=`You are the recipe engine inside GrowRecipes, a meal-planning app for students. Create ${n} NEW recipes.
Use ONLY these ingredient ids, with quantities in the unit shown (g, ml, or ea = a count): ${catalog}.
Flag letters: m meat, k pork, f fish, s shellfish, d dairy, e egg, g gluten, n tree nut, p peanut, y soy, h honey.
Requirements: dietary needs: ${p.diet.join(', ')||'none'}. STRICT allergies, never use any ingredient containing: ${p.allergies.join(', ')||'none'}. Also avoid: ${p.avoid.join(', ')||'nothing'}. Preferred cuisines: ${p.cuisines.join(', ')||'any'}. Aim for at most about $${isFinite(cap)?cap:8} per serving using inexpensive staples. Total time at most ${tm>=999?60:tm} minutes. Cook skill: ${p.exp}.
Do NOT reuse any of these recipe names: ${names}.
Recipes must be realistic, safe and delicious, with 4 to 6 beginner-friendly steps. Add " ~N" at the end of a step that takes N minutes of timed cooking. Include salt, pepper or oil as ingredients where used.
Reply with ONLY a JSON array, no other text: [{"name":"","cuisines":["one or more of: ${CUISINES.join(', ')}"],"servings":3,"time":30,"level":1,"art":"one of: ${ART_TYPES.join(', ')}","desc":"one friendly sentence","ingredients":[{"id":"chicken_breast","q":450,"d":"450 g (1 lb) chicken breast, cubed"}],"steps":["Do this. ~10"]}]`;
  const arr=await AI.sample.json(prompt,{modelTier:'default',cache:false});
  if(!Array.isArray(arr))return 0;
  let added=0;const have=new Set(allRecipes().map(r=>r.name.toLowerCase()));
  for(const o of arr){
    try{
      if(!o||typeof o.name!=='string'||have.has(o.name.toLowerCase()))continue;
      const ings=(o.ingredients||[]).filter(i=>ING[i?.id]&&typeof i.q==='number'&&i.q>0).map(i=>({id:i.id,q:i.q,d:String(i.d||ING[i.id].name).slice(0,120)}));
      const steps=(o.steps||[]).filter(s=>typeof s==='string'&&s.length>8).map(s=>{const m=s.match(/^(.*?)\s*~(\d+)$/);return m?{t:m[1].slice(0,400),m:+m[2]}:{t:s.slice(0,400),m:0}});
      if(ings.length<3||steps.length<3)continue;
      const r=buildRecipe({id:'ai-'+Math.floor(hash(o.name+Date.now())*1e9).toString(36),name:o.name.slice(0,70),
        cuis:(Array.isArray(o.cuisines)?o.cuisines:[]).filter(c=>CUISINES.includes(c)).slice(0,3).concat([]),
        serv:Math.min(8,Math.max(1,Math.round(o.servings)||3)),time:Math.min(90,Math.max(5,Math.round(o.time)||30)),
        lvl:Math.min(3,Math.max(1,Math.round(o.level)||1)),art:ART_TYPES.includes(o.art)?o.art:'bowl',
        desc:String(o.desc||'A fresh idea from GrowAI.').slice(0,200),ings,steps,ai:true});
      if(!r.cuis.length)r.cuis=['Healthy meals'];
      if(!allowed(r))continue;
      if(estimate(r).perServ>cap*1.15)continue;
      S.gen.push(r);have.add(r.name.toLowerCase());added++;
    }catch{}
  }
  if(S.gen.length>40)S.gen=S.gen.slice(-40);
  save();return added;
}

  }

  }
  if(/(how|properly).*(cook|bake|roast).*chicken|chicken.*(done|properly|safe|dry)/.test(t))
    return 'For juicy chicken: pat it dry, season well, and cook on medium-high without moving it for the first 3–4 minutes so it browns. It is safe at **74°C (165°F)** in the thickest part. No thermometer? Cut into the thickest piece. It should be white all the way through with clear juices. Rest it 5 minutes before slicing.';
  if(/pasta.*(taste|better|bland|flavou?r)|better pasta/.test(t))
    return 'Make pasta taste better:\n- Salt the water well (about 1 tbsp per 3 litres)\n- Save a cup of pasta water and splash it into the sauce\n- Cook the pasta in the sauce for the last minute\n- Finish with garlic, olive oil, lemon or a little cheese';
  if(/\$\s?\d+|under \d|cheap|budget|afford/.test(t)){
    const m=t.match(/\$?\s?(\d+(?:\.\d+)?)/),cap=m?parseFloat(m[1]):budgetCap();
    const list=pool.filter(r=>estimate(r).perServ<=cap).sort((a,b)=>estimate(a).perServ-estimate(b).perServ).slice(0,4);
    if(!list.length)return 'Nothing matches that budget with your current settings. Try a higher number.';
    return `Meals at ${money(cap)} per serving or less (sample prices):\n`+list.map(r=>`- ${mdLink(r)}: about ${money(estimate(r).perServ)} per serving`).join('\n');
  }

    toks.forEach(tok=>{const k=tok.replace(/s$/,'');Object.values(ING).forEach(i=>{if(!i.staple&&(i.name.toLowerCase().includes(k)||i.id.replace(/_/g,' ')===k))ids.add(i.id)})});
    if(!ids.size)return 'Tell me a few ingredients (like "chicken, rice and eggs") and I will find recipes that use them.';
    const ranked=pool.map(r=>({r,n:r.ings.filter(x=>ids.has(x.id)).length})).filter(o=>o.n).sort((a,b)=>b.n-a.n||estimate(a.r).perServ-estimate(b.r).perServ).slice(0,3);
    const skipped=[...ids].filter(i=>!flagsAllowed(ING[i].fl)).map(i=>ING[i].name.toLowerCase());
    const sk=skipped.length?`\nI skipped ${skipped.join(', ')} because of your dietary settings.`:'';
    if(!ranked.length)return 'I could not find a recipe in your settings that uses those. Try fewer ingredients, or check your Profile filters.'+sk;
    return 'Here is what I would cook:\n'+ranked.map(o=>`- ${mdLink(o.r)} uses ${o.n} of your ingredients, about ${money(estimate(o.r).perServ)} per serving`).join('\n')+sk;
  }
  return 'I can help with swaps (try "What can I use instead of butter?"), protein boosts, cooking tips, budget meals under a price, and ideas from the ingredients you have. The live GrowAI model is not available right now, so I am using my built-in cooking helper.';
}

      +sc(9,28,(x,y)=>`<rect x="${fix(x-5)}" y="${fix(y-4)}" width="10" height="8" rx="3" fill="${R()<.5?'var(--t2)':'var(--t3)'}" transform="rotate(${fix(R()*90)} ${fix(x)} ${fix(y)})"/>`)
      +sc(5,26,(x,y)=>`<circle cx="${fix(x)}" cy="${fix(y)}" r="5" fill="var(--t1)"/><circle cx="${fix(x-4)}" cy="${fix(y+3)}" r="3.500" fill="var(--t1)"/><circle cx="${fix(x+4)}" cy="${fix(y+3)}" r="3.500" fill="var(--t1)"/>`)

      +sc(6,32,(x,y)=>`<circle cx="${fix(x)}" cy="${fix(y)}" r="6" fill="var(--surface)" stroke="var(--t3)" stroke-width="1.500"/><circle cx="${fix(x)}" cy="${fix(y)}" r="2" fill="var(--t4)"/>`)

/* ---- tiny markdown for chat ---- */
function md(text){
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\((#recipe-[a-z0-9-]+)\)/g,'<a href="$2">$1</a>');
  const out=[];let list=null;
  String(text).split('\n').forEach(line=>{
    const m=line.match(/^\s*[-*•]\s+(.*)/);
    if(m){if(!list){list=[];out.push(list)}list.push(m[1])}
    else{list=null;if(line.trim())out.push(line)}
  });
  return out.map(b=>Array.isArray(b)?'<ul>'+b.map(i=>'<li>'+inline(i)+'</li>').join('')+'</ul>':'<p>'+inline(b)+'</p>').join('');
}

}

function pickInitial(){
  const pool=basePool();
  const pick=weightedPick(pool,Math.min(6,pool.length));
  S.seen=Array.from(new Set(S.seen.concat(pick.map(r=>r.id))));save();return pick.map(r=>r.id);
}

/* ---- Discover ---- */
function discoverList(){
  let list=allRecipes().filter(allowed);
  const q=U.q.trim().toLowerCase();
  if(q)list=list.filter(r=>(r.name+' '+r.desc+' '+r.cuis.join(' ')+' '+r.ings.map(x=>ING[x.id].name).join(' ')).toLowerCase().includes(q));
  if(U.fCuisine!=='All')list=list.filter(r=>r.cuis.includes(U.fCuisine));
  if(U.fTime!=='any')list=list.filter(r=>r.time<=+U.fTime);
  if(U.fCost!=='any')list=list.filter(r=>estimate(r).perServ<=+U.fCost);
  if(U.fProtein)list=list.filter(r=>r.prot>=25);
  const by={match:(a,b)=>scoreRecipe(b)-scoreRecipe(a),cost:(a,b)=>estimate(a).perServ-estimate(b).perServ,time:(a,b)=>a.time-b.time,protein:(a,b)=>b.prot-a.prot};
  return list.sort(by[U.fSort]);
}
function discoverResults(){
  const l=discoverList(),hidden=allRecipes().length-allRecipes().filter(allowed).length;
  return `<p class="muted" style="margin-bottom:14px">${l.length} recipe${l.length===1?'':'s'}${hidden?` · ${hidden} hidden by your dietary needs and allergies`:''}</p>`+
   (l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="empty"><h3>No recipes match those filters</h3><p>Try a different cuisine or clear the filters.</p><button class="btn" data-a="clearFilters">Clear filters</button></div>`);

  <section class="card chat-main" aria-label="Chat"><div class="msgs" id="msgs" role="log" aria-live="polite">${S.chat.length?S.chat.map(msgHTML).join(''):`<div class="m a"><div class="by">${ico('sparkle')} GrowAI</div><p>Hi${p.name?' '+esc(p.name):''}! I am GrowAI. ${R?`Ask me anything about <b>${esc(R.name)}</b>.`:'What are we cooking?'}</p></div>`}</div>
   <div class="composer"><div class="sug">${chatSuggestions().map(q=>`<button class="chip sm" data-a="send" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    <form data-form="chat" autocomplete="off"><label class="sr" for="chatIn">Message GrowAI</label><input class="inp" id="chatIn" placeholder="Ask GrowAI anything about cooking…" maxlength="500"/><button class="btn" type="submit" id="sendBtn" aria-label="Send">${ico('send')}</button></form>
    ${S.chat.length?`<div style="margin-top:8px;text-align:right"><button class="linkbtn" data-a="clearChat" style="font-size:13.5px">Clear conversation</button></div>`:''}</div></section></div>`;
}

  <section class="card"><h3>Account</h3><p class="hint">Saved on this device. Redo onboarding to walk through every question again. Your current answers stay selected.</p>
   <div class="cols2"><div><label class="lbl" for="pn">Name</label><input class="inp" id="pn" value="${esc(p.name)}" data-change="name"/></div><div><label class="lbl" for="pe">Email</label><input class="inp" id="pe" type="email" value="${esc(p.email)}" data-change="email" placeholder="you@school.edu"/></div></div>
   <div class="row" style="margin-top:16px"><button class="btn soft sm" data-a="editStep" data-v="1">${ico('leaf')} Reset dietary needs</button><button class="btn soft sm" data-a="editStep" data-v="2">${ico('heart')} Reset what I love to eat</button><button class="btn sm" data-a="redoOnb">${ico('refresh')} Redo onboarding</button><button class="btn ghost sm" data-a="logout">Log out</button><button class="btn ghost sm" data-a="resetAll">${ico('trash')} Delete my data</button></div></section>

  <section class="card"><h3>Budget</h3><p class="hint">Maximum cost per serving.</p>${secBudget()}</section>
  <section class="card"><h3>Location and grocery stores</h3><p class="hint">Used to compare prices.</p>${secLocation()}</section>
  <section class="card"><h3>Cooking</h3>${secCook()}</section>
  <p class="muted"><a href="#brand">GrowRecipes brand kit</a></p></div>`;

   <div class="row" style="margin-top:18px">${['app','icon','reversed'].map(k=>`<button class="btn soft sm" data-a="dlLogo" data-v="${k}">${ico('download')} ${{app:'App icon SVG',icon:'Icon SVG',reversed:'Reversed icon SVG'}[k]}</button>`).join('')}</div></div>

/* ================= ROUTER & RENDER ================= */
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let DL=null;
function route(){
  const h=(location.hash||'').replace(/^#/,'');
  if(h.startsWith('recipe-'))return {name:'recipe',id:h.slice(7)};
  return {name:['home','discover','favourites','assistant','profile','brand'].includes(h)?h:'home'};
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
function modalHTML(){
  if(U.modal==='login')return `<div class="scrim" data-a="closeModal" role="dialog" aria-modal="true" aria-labelledby="mh"><div class="modal"><h3 id="mh">Welcome back</h3><p class="muted" style="margin-bottom:16px">Enter the email you saved your profile with. In this demo, accounts are stored on this device.</p>
    <form data-form="login"><label class="lbl" for="lemail">Email</label><input class="inp" id="lemail" type="email" required placeholder="you@school.edu" autocomplete="email"/>${U.modalErr?`<div class="err">${esc(U.modalErr)}</div>`:''}
    <div class="row" style="margin-top:18px;justify-content:flex-end"><button type="button" class="btn ghost" data-a="closeModal">Cancel</button><button class="btn" type="submit">Log in</button></div></form></div></div>`;
  if(U.modal==='reset')return `<div class="scrim" data-a="closeModal" role="dialog" aria-modal="true" aria-labelledby="mh"><div class="modal"><h3 id="mh">Delete your data?</h3><p class="muted">This removes your preferences, favourites and chats from this device. You will start onboarding again.</p>
    <div class="row" style="margin-top:20px;justify-content:flex-end"><button class="btn ghost" data-a="closeModal">Cancel</button><button class="btn" data-a="doReset">Delete my data</button></div></div></div>`;
  return '';
}
function render(){
  const r=route();let html;
  if(r.name==='brand'){
    html=`<header class="top"><div class="wrap"><a href="${S.onboarded?'#home':'#home'}" style="display:inline-flex">${logo('sm')}</a></div></header><main><div class="wrap">${brandView()}</div></main>`;
  }else if(!S.onboarded||U.editOnly){
    html=onboardingView();
  }else{
    const body={home:homeView,discover:discoverView,favourites:favouritesView,assistant:assistantView,profile:profileView,recipe:()=>recipeView(r.id)}[r.name]();
    html=shell(r,body);
  }
  const y=window.scrollY;
  app.innerHTML=html+modalHTML();
  U.animStep=S.step;
  if(U.focus){const el=document.getElementById(U.focus);if(el){el.focus();}U.focus=null}
  if(r.name==='assistant'&&S.onboarded){const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;if(U.pending){const q=U.pending;U.pending=null;setTimeout(()=>sendChat(q),50)}}
  if(U.keepScroll){window.scrollTo(0,y);U.keepScroll=false}
}
function rerender(keep=true){U.keepScroll=keep;render()}
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render()});

/* ================= ACTIONS ================= */
function toggleIn(arr,v){const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v)}
function prefsChanged(){S.rec.ids=null;save();rerender();toast('Saved. Your next recipes will reflect this.')}
function inOnboarding(){return !S.onboarded||!!U.editOnly}
function afterPref(){if(inOnboarding()){save();rerender()}else prefsChanged()}
function syncFav(id){
  document.querySelectorAll(`[data-a="fav"][data-id="${id}"]`).forEach(b=>{
    b.setAttribute('aria-pressed',isFav(id));
    if(b.classList.contains('heart'))b.setAttribute('aria-label',(isFav(id)?'Remove from favourites':'Save to favourites'));
    else if(b.classList.contains('btn')&&b.textContent.match(/Save/))b.innerHTML=`${ico('heart')} ${isFav(id)?'Saved':'Save'}`;
  });
}
function syncRegen(){
  const b=$('#regenBtn');if(b){b.disabled=U.loading;b.innerHTML=`${ico('refresh',U.loading?'spin':'')} ${U.loading?'Finding recipes…':'Find more recipes'}`}
  const rc=$('#recs');if(rc)rc.innerHTML=recsHTML();
}
const A={
  start(){S.step=1;save();rerender(false);window.scrollTo(0,0)},
  login(){U.modal='login';U.modalErr='';render();setTimeout(()=>$('#lemail')?.focus(),30)},
  closeModal(el,e){if(e.target!==el&&el.classList.contains('scrim'))return;U.modal=null;render()},
  next(){
    if(S.step===1&&!S.prof.diet.length)S.prof.diet=['No restrictions'];
    S.step=Math.min(STEP_COUNT+1,S.step+1);save();render();window.scrollTo(0,0);
  },
  back(){S.step=Math.max(0,S.step-1);save();render();window.scrollTo(0,0)},
  finish(){S.onboarded=true;S.rec.ids=null;save();location.hash='#home';render();window.scrollTo(0,0)},
  togDiet(el){
    const v=el.dataset.v,d=S.prof.diet;
    if(v==='No restrictions'){S.prof.diet=d.includes(v)?[]:['No restrictions']}
    else{const i=d.indexOf('No restrictions');if(i>=0)d.splice(i,1);toggleIn(S.prof.diet,v)}
    afterPref();
  },
  togCuisine(el){toggleIn(S.prof.cuisines,el.dataset.v);afterPref()},
  togAllergy(el){toggleIn(S.prof.allergies,el.dataset.v);afterPref()},
  rmAvoid(el){S.prof.avoid.splice(+el.dataset.v,1);afterPref()},
  setBudget(el){S.prof.budget=el.dataset.v;S.prof.custom='';afterPref()},
  setExp(el){S.prof.exp=el.dataset.v;afterPref()},
  setTime(el){S.prof.time=el.dataset.v;afterPref()},
  togStore(el){toggleIn(S.prof.stores,el.dataset.v);afterPref()},
  useLoc(){
    if(!navigator.geolocation){toast('Location is not available here. Type your city or postal code instead.');return}
    toast('Asking for your location…');
    navigator.geolocation.getCurrentPosition(p=>{S.prof.lat=p.coords.latitude;S.prof.lng=p.coords.longitude;save();rerender();toast('Location saved on this device.')},
      ()=>toast('We could not get your location. Type your city or postal code instead.'),{timeout:8000});
  },
  async regen(){
    if(U.loading)return;
    U.loading=true;syncRegen();
    try{await Promise.all([buildRecs(6,true),sleep(900)])}catch(e){}
    U.loading=false;
    if(route().name==='home')syncRegen();
    $('#recs')?.scrollIntoView({behavior:'smooth',block:'nearest'});
  },
  preset(el){
    Object.assign(U,{q:'',fCuisine:'All',fTime:'any',fCost:'any',fSort:'match',fProtein:false});
    const v=el.dataset.v;
    if(v==='cheap'){U.fCost='5';U.fSort='cost'}
    if(v==='protein'){U.fProtein=true;U.fSort='protein'}
    if(v==='quick'){U.fTime='20';U.fSort='time'}
    if(v==='week'){U.fCost='4';U.fSort='cost'}
  },
  fav(el){
    const id=el.dataset.id;toggleIn(S.favs,id);save();syncFav(id);
    toast(isFav(id)?'Saved to favourites':'Removed from favourites');
    if(route().name==='favourites')rerender();
  },
  cheapest(el){
    const r=recipeById(el.dataset.id);if(!r)return;
    S.cmpOpen[r.id]=true;save();$('#cmp').innerHTML=comparisonHTML(r);
    $('#cmp').scrollIntoView({behavior:'smooth',block:'start'});
  },
  cmode(el){S.cmode=el.dataset.v;save();const r=recipeById(route().id);if(r)$('#cmp').innerHTML=comparisonHTML(r)},
  togProtein(el){U.fProtein=!U.fProtein;el.setAttribute('aria-pressed',U.fProtein);$('#dres').innerHTML=discoverResults()},
  clearFilters(){Object.assign(U,{q:'',fCuisine:'All',fTime:'any',fCost:'any',fSort:'match',fProtein:false});rerender()},
  askAbout(el){S.ctx=el.dataset.id;U.pending=el.dataset.v||null;save();location.hash='#assistant'},
  clearCtx(){S.ctx=null;save();rerender()},
  send(el){sendChat(el.dataset.v)},
  stopChat(){U.ctl?.abort()},
  clearChat(){S.chat=[];save();rerender()},
  editStep(el){U.editOnly=true;S.step=+el.dataset.v;U.animStep=-1;render();window.scrollTo(0,0)},
  saveEdit(){U.editOnly=false;S.rec.ids=null;save();render();window.scrollTo(0,0);toast('Saved. Your next recipes will reflect this.')},
  cancelEdit(){U.editOnly=false;render();window.scrollTo(0,0)},
  redoOnb(){U.editOnly=false;S.onboarded=false;S.step=1;S.rec.ids=null;U.animStep=-1;save();location.hash='#home';render();window.scrollTo(0,0)},
  logout(){S=freshState();lsSet(LSK,S);location.hash='#home';render();window.scrollTo(0,0)},
  resetAll(){U.modal='reset';render()},
  doReset(){const a=lsGet(ACCK)||{};if(S.prof.email){delete a[S.prof.email.toLowerCase()];lsSet(ACCK,a)}S=freshState();lsSet(LSK,S);U.modal=null;location.hash='#home';render();window.scrollTo(0,0)},
  async dlLogo(el){
    const v=el.dataset.v,svg=v==='app'?markApp():v==='icon'?markPlain('#2E8B57'):markPlain('#FFFFFF');
    if(!DL){toast('Downloads are not available in this view.');return}
    try{await DL.save({filename:{app:'growrecipes-app-icon.svg',icon:'growrecipes-icon.svg',reversed:'growrecipes-icon-reversed.svg'}[v],data:svg})}catch{}
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=A[el.dataset.a];if(!f)return;
  if(el.tagName==='A'&&el.dataset.a!=='preset')e.preventDefault();
  f(el,e);
});

/* inputs */
const CH={
  fCuisine:el=>{U.fCuisine=el.value;$('#dres').innerHTML=discoverResults()},
  fTime:el=>{U.fTime=el.value;$('#dres').innerHTML=discoverResults()},
  fCost:el=>{U.fCost=el.value;$('#dres').innerHTML=discoverResults()},
  fSort:el=>{U.fSort=el.value;$('#dres').innerHTML=discoverResults()},
  favC:el=>{U.favC=el.value;$('#favres').innerHTML=favResults()},
  name:el=>{S.prof.name=el.value.trim();save()},
  email:el=>{const v=el.value.trim();if(v&&!/^\S+@\S+\.\S+$/.test(v)){toast('That email does not look right.');return}S.prof.email=v;save()},
  locText:el=>{S.prof.locText=el.value.trim();save()},
  customBudget:el=>{const v=parseFloat(el.value);if(v>0){S.prof.budget='custom';S.prof.custom=String(v);document.querySelectorAll('.opt[data-a="setBudget"]').forEach(b=>b.setAttribute('aria-pressed','false'));save();if(S.onboarded){S.rec.ids=null;toast('Budget saved.')}}else{el.value=''}},
  tickIng:el=>{const[id,v]=[el.dataset.id,el.dataset.v];(S.checks[id]=S.checks[id]||{})[v]=el.checked;save();el.closest('li').classList.toggle('done',el.checked)},
  tickShop:el=>{S.shop[el.dataset.v]=el.checked;save();el.closest('label').classList.toggle('done',el.checked)}
};
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&CH[el.dataset.change])CH[el.dataset.change](el)});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-input]');if(!el)return;
  if(el.dataset.input==='searchLive'){U.q=el.value;if(route().name==='discover'&&$('#dres'))$('#dres').innerHTML=discoverResults()}
  if(el.dataset.input==='favQ'){U.favQ=el.value;$('#favres').innerHTML=favResults()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&U.modal){U.modal=null;render();return}
  if(e.key!=='Enter')return;
  const el=e.target.closest('[data-enter]');if(!el)return;
  e.preventDefault();
  if(el.dataset.enter==='addAvoid'){
    const v=el.value.trim();if(!v)return;
    if(!S.prof.avoid.some(a=>a.toLowerCase()===v.toLowerCase()))S.prof.avoid.push(v);
    U.focus=el.id;if(inOnboarding()){save();render()}else{S.rec.ids=null;save();render();toast('Added. Recipes with “'+v+'” are hidden.')}
  }
  if(el.dataset.enter==='globalSearch'){U.q=el.value;if(route().name==='discover'){rerender()}else location.hash='#discover'}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  if(f.dataset.form==='chat'){const i=$('#chatIn');const v=i.value;i.value='';sendChat(v)}
  if(f.dataset.form==='login'){
    const em=$('#lemail').value.trim().toLowerCase(),a=(lsGet(ACCK)||{})[em];
    if(!a){U.modalErr='No profile found for that email on this device. Choose Get started to create one.';render();setTimeout(()=>$('#lemail')?.focus(),30);return}
    const n=Object.assign(freshState(),a);n.prof=Object.assign(freshProfile(),a.prof||{});S=n;lsSet(LSK,S);U.modal=null;location.hash='#home';render();window.scrollTo(0,0);toast('Welcome back!');
  }
});

/* ================= CHAT ================= */
function addBubble(html,cls,id){
  const box=$('#msgs');if(!box)return null;
  const d=document.createElement('div');d.className='m '+cls;if(id)d.id=id;d.innerHTML=html;box.appendChild(d);box.scrollTop=box.scrollHeight;return d;
}
function setSendMode(busy){
  const b=$('#sendBtn');if(!b)return;
  b.type=busy?'button':'submit';b.setAttribute('aria-label',busy?'Stop':'Send');
  if(busy)b.dataset.a='stopChat';else delete b.dataset.a;
  b.innerHTML=busy?ico('stop'):ico('send');
}
async function sendChat(text){
  text=(text||'').trim();if(!text||U.busy)return;
  if(route().name!=='assistant'){U.pending=text;location.hash='#assistant';return}
  U.busy=true;
  S.chat.push({role:'user',text});save();
  const first=$('#msgs .m.a:only-child');if(first&&S.chat.length===1)first.remove();
  addBubble(esc(text),'u');
  const live=addBubble('<div class="by">'+ico('sparkle')+' GrowAI</div><div class="dots" aria-label="GrowAI is thinking"><i></i><i></i><i></i></div>','a','live');
  let reply='';
  const R=(h)=>{live.innerHTML='<div class="by">'+ico('sparkle')+' GrowAI</div>'+h;$('#msgs').scrollTop=$('#msgs').scrollHeight};
  if(AI.available()){
    U.ctl=new AbortController();setSendMode(true);
    try{reply=await askAI(S.chat,t=>R(md(t)),U.ctl.signal)}
    catch(e){
      const code=e&&e.code;
      if(code==='cancelled')reply=(e.text||'').trim()||'Stopped. Ask me again whenever you like.';
      else if(code==='not_granted'||code==='unavailable'){U.aiOn=false;reply=localAnswer(text);const m=$('#aiMode');if(m)m.textContent='Using the built-in cooking helper. Live GrowAI is not available here.'}
      else if(code==='rate_limited')reply='I am getting a lot of questions right now. Give me a moment, then try again.';
      else reply=localAnswer(text);
    }
    setSendMode(false);
  }else{
    await sleep(550);reply=localAnswer(text);
  }
  if(!reply)reply='Sorry, I could not come up with an answer. Try rephrasing your question.';
  S.chat.push({role:'assistant',text:reply});if(S.chat.length>40)S.chat=S.chat.slice(-40);save();
  if(live.isConnected){R(md(reply));live.removeAttribute('id')}
  U.busy=false;
  $('#chatIn')?.focus();
}

/* ================= BOOT ================= */
(async function boot(){
  render();
  try{await AI.init();if(window.claude&&window.claude.use)DL=await window.claude.use('downloads')}catch{}
  if(route().name==='assistant'&&!U.busy)rerender();
})();

</script>
